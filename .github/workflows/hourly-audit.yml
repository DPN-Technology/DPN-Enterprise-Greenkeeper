name: DPN Enterprise Hourly Audit
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dpn-hourly-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate organization audit credential
        env:
          DPN_AUDIT_TOKEN: ${{ secrets.DPN_AUDIT_TOKEN }}
        run: |
          if [ -z "$DPN_AUDIT_TOKEN" ]; then
            echo "::error::Set repository secret DPN_AUDIT_TOKEN to a read-only org-scoped token for private DPN repositories."
            exit 1
          fi
      - name: Generate full audit and publish reports
        env:
          DPN_AUDIT_TOKEN: ${{ secrets.DPN_AUDIT_TOKEN }}
          REPORT_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/hourly_audit.py
