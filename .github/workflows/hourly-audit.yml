name: DPN Enterprise Hourly Audit
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dpn-hourly-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout reporting repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Audit private organization repositories and publish reports
        env:
          DPN_AUDIT_TOKEN: ${{ secrets.DPN_AUDIT_TOKEN }}
          REPORT_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${DPN_AUDIT_TOKEN:-}" ]; then
            echo "::warning::DPN_AUDIT_TOKEN is not configured. Auditing only repositories visible to GITHUB_TOKEN; private organization-wide coverage may be incomplete."
            export DPN_AUDIT_TOKEN="$REPORT_TOKEN"
          fi
          python3 scripts/hourly_audit.py
